# 对方机器上跑的「完整方案接收端」专用配置（给对方用）。
# 我方下传地址写在 packing-system/config/packing_config.yaml 的
#   data_source.internal_base_url + internal_path
# 不要和本文件的 host: 0.0.0.0 搞混。

server:
  # TODO(监听地址-对方机器): 必须写 0.0.0.0，表示在本机所有网卡上接听。
  #   这不是「对方 IP」，也不是我方 POST 的目标地址。
  #   若写成 127.0.0.1，局域网其它电脑将连不上。
  host: "0.0.0.0"
  # TODO(端口-对方机器): 监听端口；我方 packing_config 的 internal_base_url 端口必须一致。
  port: 8094

# TODO(本机对外根地址-填对方自己的 IPv4): 仅用于打印/告诉我方「请 POST 到这里」。
#   格式: http://对方电脑局域网IPv4:端口
#   当前对方接收机 IPv4 = 192.168.0.202
#   我方配置应对齐为: packing_config.yaml → internal_base_url: http://192.168.0.202:8094
advertise_base_url: http://192.168.0.202:8094

# TODO(保存目录-对方机器本地盘): 收到的 packing_plan JSON 存这里。
save_dir: "D:/research_code/xiafa"

# TODO(接口 path): 与我方 packing_config.yaml 的 data_source.internal_path 必须完全一致。
internal_path: /adaptor/api/wcs/internal
