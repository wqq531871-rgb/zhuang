# 局域网 WCS 接收端专用配置（仅本目录服务使用，与 packing_config.yaml 的接口1/2 分离）。
# 完整对外地址 = advertise_base_url + 下方 path。
# 对方 Swagger 参考: http://192.168.0.191:8092/swagger/index.html
# 我方 Swagger:     {advertise_base_url}/swagger/index.html

server:
  # TODO(监听地址): 必须 0.0.0.0 才能让同一局域网访问；127.0.0.1 仅本机。
  host: "0.0.0.0"
  # TODO(端口): 联调/现场改端口；Windows 防火墙需放行该端口入站。
  port: 7002

# TODO(本机对外根地址): 协议+本机局域网 IPv4+端口，发给对方联调用。
#   当前本机 IPv4=192.168.0.8；换网段时只改这一行。
advertise_base_url: http://10.19.136.146:7002

# TODO(接口 path): 与对方约定一致；一般不用改。编号对标接口文档 4.3～4.7。
paths:
  # TODO(4.3 拼箱物料信息下发 path): 对方 → 我；写选定托盘会话（现场码垛「托盘已选定」）。
  sendcasetask_path: /adaptor/api/wcs/sendcasetask
  # TODO(4.4 物料到达 path): 对方 → 我；当前仅回成功，不做业务处理。
  boxarrive_path: /adaptor/api/wcs/boxarrive
  # TODO(4.6 托盘到达 path): 对方 → 我；当前仅回成功；业务状态机待定。
  palletarrive_path: /adaptor/api/wcs/palletarrive
  # TODO(4.7 获取系统信息 path): 对方 → 我，GET；最快约 1s/次。注意无 adaptor 前缀。
  status_path: /api/status
  # TODO(Swagger 文档 path): 仿对方 /swagger/index.html，浏览器打开可看接口。
  swagger_path: /swagger/index.html

# TODO(日志): 相对 local_wcs_receiver/；save_requests=true 时每次请求落盘。
log_dir: logs
save_requests: true

# TODO(4.7 设备状态): 0=就绪(MAX VP运行中+无任务), 1=执行中(运行中+有任务), 99=停止/异常。
#   TODO(4.7-判定): 何时空闲/何时有任务待定；当前为配置静态值，联调可改。
device_status: 0

# TODO(校验严格度): false=缺字段仍回 code=0（联调友好）；true=缺必填回非 0。
strict_validation: false

# TODO(业务对接-P1): true 时按 box_unique_id 查本地 wcs_plan_map；P0 先关。
lookup_plan_map: false
# TODO(plan map 搜索): lookup_plan_map=true 时生效。
# plan_map_glob: ../packing-workspace/output/wcs_plan_map_*.json

# TODO(PLC 自动监听): 发现 wcs_success_box.state=1/2 后自动构造并下传（桩发送）。
plc_auto:
  enabled: true
  poll_interval_sec: 0.5
  packing_config: ../config/packing_config.yaml

# TODO(接法B-判态监听): 相机只写 camera_*；本监听发现尺寸齐全且 state 为空后自动判定。
state_judge:
  enabled: true
  poll_interval_sec: 0.5
  tol_mm: 5.0
  packing_config: ../config/packing_config.yaml
