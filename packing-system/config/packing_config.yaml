# 运行命令：python packing/run_packing.py --config config/packing_config.yaml
# （也可省略 --config，默认即读本文件）
# 运行模式：normal = 普通单次装箱(读 excel_data)；
#           incremental = 增量装箱(读 incremental.source_file，三表 Excel：
#           最终挑选结果/新增箱/BMS，先装初始单、再把未达标盘的箱+新增箱重排合并)。
run_mode: normal

# 增量模式数据文件（相对 data/，需含"新增箱"表）。仅 run_mode=incremental 时生效。
incremental:
  source_file: selected_6000_full_regular_10_0_chain.xlsx

pallets:
  MH423C:
    length: 1440.0
    width: 2240.0
    height: 720.0
    target_index: 192

constraints:
  # 主装箱算法：'gcp' = 全局列式装箱 + 柱级组合优化（默认，规则数据达标率最高，
  # 复杂/不规则分组自动回退 beam）；'beam' = 旧 beam + 配方优先 + 救援链。
  main_packer: gcp
  # GCP 未捕获业务组指数上限时，限时运行 beam+配方+完整救援链并严格择优。
  dual_path_enabled: true
  dual_path_time_limit_seconds: 30.0
  # 在破坏性整盘重排前，保留 receiver 布局，仅从同 case_group donor 取顶层箱补缺口。
  directed_exchange_enabled: true
  directed_exchange_max_items: 4
  directed_exchange_max_attempts: 40
  # 现有 GCP 未达到指数理论上限时，先用 CP-SAT 选择达标子集，再精确摆柱落地。
  cpsat_target_subset_enabled: true
  cpsat_target_subset_time_limit_seconds: 3.0
  cpsat_target_subset_max_attempts: 6
  max_box_gap_mm: 6.0
  support_ratio_threshold: 0.8
  center_of_mass_tolerance: 0.3333333333333333
  suction_reachability_enabled: true
  small_box_below_enabled: true
  same_size_heavier_below_enabled: true
  height_multiple_layering_enabled: true
  suction_cup_length: 600.0
  suction_cup_width: 800.0
  suction_xy_clearance: 0.0
  suction_z_clearance: 0.0
  suction_allow_rotation_90: true
  # baseline 是否允许箱子 90° 旋转（朝向规整，带几何门槛：仅对"旋转能让单类
  # 整层从不达标变达标"的箱型换向，救旋转敏感订单且不打乱已紧凑的难组布局）。
  # 仅作用于 baseline 路径；GCP 有独立朝向处理(_fp_orient/CP-SAT)。默认 true。
  allow_box_rotation_90: true
execution_sequence:
  # false 时跳过执行顺序规划（run_execution_planning / 一键装箱后置步骤都不生成）。
  # true 时：根目录 run_packing、以及 UI「一键装箱」（Excel / 接口 WCS）在写出 packing_plan 后自动生成
  #   *_execution.json / *_execution_wcs.json / *_execution_wcs_map.json。
  enabled: true
  # 同高度安全候选箱从指定托盘角点向外扩散。
  # 可选：x_min_y_min / x_min_y_max / x_max_y_min / x_max_y_max
  origin: x_min_y_min
  # 几何比较容差，用于判断接触、重合和同一高度。
  coordinate_tolerance_mm: 0.000001
  # 箱体垂直下放路径的 XY 额外安全包络。
  box_xy_clearance_mm: 0.0
  # 吸盘垂直下放路径的 XY 额外安全包络。
  suction_xy_clearance_mm: 2.0
  # 吸盘下降至目标箱顶时要求保留的 Z 安全余量。
  suction_z_clearance_mm: 0.0
  # true 时每个箱子必须包含完整 suction_rect_* 字段。
  require_suction_pose: true
  # 放置目标箱时，允许同高或更高邻箱占用的最大侧面方向数（x-/x+/y-/y+）。
  max_occupied_directions: 2
  # 判断侧面邻箱时允许的最大水平间隙。
  side_neighbor_clearance_mm: 5.0
  # 判断同高围挡和局部高度波前时的顶面高度容差。
  side_height_tolerance_mm: 2.0
  # true 时用残余反向可完成性检查保证执行时保留开放方向。
  preserve_open_direction: true
  # 兼容保留；稳定正向调度不把邻边形状加入排序键。
  prefer_adjacent_occupied_sides: true
  # 每个托盘防包围规划的最长时间。
  max_sequence_search_seconds_per_pallet: 1.0
  # true：仅同层高度起伏频繁的托盘使用原点阶梯波；false：全部逐层。
  adaptive_staircase_enabled: false
  # 同层相邻箱顶达到该高度差时，计为一次显著高度跳变。
  staircase_height_difference_threshold_mm: 120.0
  # 同层显著高度跳变边占全部相邻边的最低比例。
  staircase_transition_ratio_threshold: 0.15
  # 单层至少出现该数量的显著高度跳变边才启用阶梯波。
  staircase_min_transition_edges: 2
  # 同层 X 坐标相差不超过该值时视为同一扫描列。
  scan_column_tolerance_mm: 5.0
tolerances:
  # TODO: 后续统一注入主装箱、GCP、重排和全部救援路径；当前部分路径仍使用代码内常量。
  # 在统一注入完成前，修改本段数值不能保证所有装箱路径同步变化。
  xy_tolerance: 2.0
  z_tolerance: 0.0
algorithm:
  num_restarts: 30
  beam_width: 6
  candidate_limit: 30
  max_candidate_points: 200
  max_points_per_layer: 40
rescue:
  max_gap: 64.0
  max_attempts: 80
  topup_max_donor_scan: 80
  hole_fill_max_donor_scan: 160
  hole_fill_max_add_items: 8
  recipe_max_group_boxes: 400
  recipe_max_count: 12
small_box_detection:
  index_smooth_window: 5
  index_plateau_window: 6
  index_plateau_rel_tol: 0.02
  index_plateau_abs_tol: 0.8
  index_min_slope_window: 3
  index_near_peak_gap: 0.15
excel_data:
  # 数据集文件名（相对 data/ 目录）。改这一行即可切换数据集，无需改代码。
  # 文件不存在时自动回退内置默认数据集。
  source_file: selected_5000_boxes_9_1_concentrated_3orders.xlsx
  result_sheet: 最终挑选结果
  bms_sheet: 包装物料主数据(BMS)

# data_source / database：全局唯一配置（算法、WCS 服务、UI 共用本文件，勿在代码里再写一份）。
# 完整 URL = api_base_url（或备用）+ stock_path / plan_path。
data_source:
  mode: api
  # TODO(真实接口开关/后端调试): true=用 api_base_url，失败则整服务停止；
  #   false=用 api_fallback_url（Postman）。仅改本配置，无界面开关。
  use_real_api: true
  # TODO(现场接口根地址): 真实 WCS「协议+IP/域名+端口」，到现场改成正式地址。
  api_base_url: http://192.168.0.191:8092
  # TODO(备用 Mock 地址): use_real_api=false 时使用；换成你的 Postman Mock 根地址。
  api_fallback_url: https://3c3758c8-755a-499e-b580-76afda706e5e.mock.pstmn.io
  # TODO(接口1 path): 库存拉取路径，拼在根地址后。
  stock_path: /api/wcs/reqstockinfo
  # TODO(接口2 path): 规划结果推送路径，拼在根地址后。
  plan_path: /api/wcs/sendpalletplanresult
  # TODO(拉取间隔): 接口1 轮询间隔（秒）。UI「拉取间隔」可改，写入本次临时配置后生效。
  download_interval: 200
  input_dir: input
  bms_reference_file: selected_5000_boxes_9_1_concentrated_3orders.xlsx

# TODO(数据库): 全局唯一；现场改 host/port/user/password/database。
#   可用 packing_config.local.yaml 覆盖密码（已被 gitignore），勿把生产密码提交仓库。
database:
  host: localhost
  port: 3306
  user: root
  # TODO(数据库密码): 现场部署改成正式密码。
  password: "123456"
  database: zhuangdb
  charset: utf8mb4
