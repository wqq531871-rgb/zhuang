# 运行命令：python packing/run_packing.py --config config/packing_config.yaml
# （也可省略 --config，默认即读本文件）
# 运行模式：normal = 普通单次装箱(读 excel_data)；
#           incremental = 增量装箱(读 incremental.source_file，三表 Excel：
#           最终挑选结果/新增箱/BMS，先装初始单、再把未达标盘的箱+新增箱重排合并)。
run_mode: normal

# 增量模式数据文件（相对 data/，需含"新增箱"表）。仅 run_mode=incremental 时生效。
incremental:
  source_file: selected_6000_full_regular_10_0_chain.xlsx

pallets:
  MH423C:
    length: 1440.0
    width: 2240.0
    height: 720.0
    target_index: 192

constraints:
  # 主装箱算法：'gcp' = 全局列式装箱 + 柱级组合优化（默认，规则数据达标率最高，
  # 复杂/不规则分组自动回退 beam）；'beam' = 旧 beam + 配方优先 + 救援链。
  main_packer: gcp
  max_box_gap_mm: 6.0
  support_ratio_threshold: 0.8
  center_of_mass_tolerance: 0.3333333333333333
  suction_reachability_enabled: true
  small_box_below_enabled: true
  same_size_heavier_below_enabled: true
  height_multiple_layering_enabled: true
  suction_cup_length: 600.0
  suction_cup_width: 800.0
  suction_xy_clearance: 0.0
  suction_z_clearance: 0.0
  suction_allow_rotation_90: true
  # baseline 是否允许箱子 90° 旋转（朝向规整，带几何门槛：仅对"旋转能让单类
  # 整层从不达标变达标"的箱型换向，救旋转敏感订单且不打乱已紧凑的难组布局）。
  # 仅作用于 baseline 路径；GCP 有独立朝向处理(_fp_orient/CP-SAT)。默认 true。
  allow_box_rotation_90: true
tolerances:
  xy_tolerance: 2.0
  z_tolerance: 0.0
algorithm:
  num_restarts: 30
  beam_width: 6
  candidate_limit: 30
  max_candidate_points: 200
  max_points_per_layer: 40
rescue:
  max_gap: 64.0
  max_attempts: 80
  topup_max_donor_scan: 80
  hole_fill_max_donor_scan: 160
  hole_fill_max_add_items: 8
  recipe_max_group_boxes: 400
  recipe_max_count: 12
small_box_detection:
  index_smooth_window: 5
  index_plateau_window: 6
  index_plateau_rel_tol: 0.02
  index_plateau_abs_tol: 0.8
  index_min_slope_window: 3
  index_near_peak_gap: 0.15
excel_data:
  # 数据集文件名（相对 data/ 目录）。改这一行即可切换数据集，无需改代码。
  # 文件不存在时自动回退内置默认数据集。
  source_file: selected_5000_boxes_9_1_concentrated_3orders.xlsx
  result_sheet: 最终挑选结果
  bms_sheet: 包装物料主数据(BMS)

# data_source / database：全局唯一配置（算法、WCS 服务、UI 共用本文件，勿在代码里再写一份）。
# 完整 URL = api_base_url（或备用）+ stock_path / plan_path。
data_source:
  mode: api
  # TODO(真实接口开关/后端调试): true=用 api_base_url，失败则整服务停止；
  #   false=用 api_fallback_url（Postman）。仅改本配置，无界面开关。
  use_real_api: true
  # TODO(现场接口根地址): 真实 WCS「协议+IP/域名+端口」，到现场改成正式地址。
  api_base_url: http://192.168.0.191:8092
  # TODO(备用 Mock 地址): use_real_api=false 时使用；换成你的 Postman Mock 根地址。
  api_fallback_url: https://3c3758c8-755a-499e-b580-76afda706e5e.mock.pstmn.io
  # TODO(接口1 path): 库存拉取路径，拼在根地址后。
  stock_path: /api/wcs/reqstockinfo
  # TODO(接口2 path): 规划结果推送路径，拼在根地址后。
  plan_path: /api/wcs/sendpalletplanresult
  # TODO(拉取间隔): 接口1 轮询间隔（秒）。UI「拉取间隔」可改，写入本次临时配置后生效。
  download_interval: 200
  input_dir: input
  bms_reference_file: selected_5000_boxes_9_1_concentrated_3orders.xlsx

# TODO(数据库): 全局唯一；现场改 host/port/user/password/database。
#   可用 packing_config.local.yaml 覆盖密码（已被 gitignore），勿把生产密码提交仓库。
database:
  host: localhost
  port: 3306
  user: root
  # TODO(数据库密码): 现场部署改成正式密码。
  password: "123456"
  database: zhuangdb
  charset: utf8mb4
